sections:
  - id: "motivation"
    title: "Motivation"
    body: |
      Clinical endoscopy datasets are often highly imbalanced, where majority classes dominate the training data. This imbalance makes it difficult for classification models to learn rare Crohn's disease [1] findings such as ulceration, edema, and stenosis.

      Our work investigates whether diffusion-generated synthetic images can help improve classification performance under severe class imbalance.
    figures:
      - id: "dataset-fold-distribution"
        path: "content/assets/crohn-ipi-diffusion/fig1-dataset-overview.pdf"
        width: 1.18
        height_cm: 12.8
        caption: "Figure 1. CrohnIPI dataset distribution across five folds. The normal class dominates the dataset, creating a strong class-imbalance problem."

  - id: "research-question"
    title: "Research Question"
    key_question: "To what extent can per-class diffusion-generated synthetic images improve the classification performance of CrohnIPI models under severe class imbalance?"

  - id: "dataset"
    title: "Dataset"
    dataset_name: "CrohnIPI endoscopy image dataset"
    classes:
      - code: "N"
        name: "Normal"
      - code: "E"
        name: "Erythema"
      - code: "O"
        name: "Edema"
      - code: "AU"
        name: "Aphthoid Ulceration"
      - code: "S"
        name: "Stenosis"
      - code: "U3-10"
        name: "Ulceration between 3 mm and 10 mm"
      - code: "U>10 / U_gt_10"
        name: "Ulceration greater than 10 mm"
    evaluation_setup: "5-fold cross-validation"
    main_challenge: "Severe class imbalance, where the majority class dominates and rare pathological classes have fewer examples."
    figures:
      layout: "class_grid"
      columns: 4
      image_height_cm: 7.6
      item_width: 0.242
      gap_width: 0.006
      caption: "Figure 2. Representative CrohnIPI endoscopy examples from the seven dataset classes."
      items:
        - label: "N"
          path: "content/assets/crohn-ipi-diffusion/individual-images/N.jpg"
        - label: "E"
          path: "content/assets/crohn-ipi-diffusion/individual-images/E.jpg"
        - label: "O"
          path: "content/assets/crohn-ipi-diffusion/individual-images/O.jpg"
        - label: "AU"
          path: "content/assets/crohn-ipi-diffusion/individual-images/AU.jpg"
        - label: "S"
          path: "content/assets/crohn-ipi-diffusion/individual-images/S.jpg"
        - label: "U3-10"
          path: "content/assets/crohn-ipi-diffusion/individual-images/U3_10.jpg"
        - label: "U>10"
          path: "content/assets/crohn-ipi-diffusion/individual-images/U_gt_10.jpg"

  - id: "proposed-method"
    title: "Proposed Method"
    body: |
      We train per-class LoRA diffusion [3] adapters using real CrohnIPI images. Each adapter generates synthetic images for a specific clinical class. The generated images are then passed through multiple filtering steps before being used to train a ConvNeXt-Large [2] classifier.
    figures:
      - id: "synthetic-augmentation-pipeline"
        path: "content/assets/crohn-ipi-diffusion/fig3-proposed-solution.png"
        width: 1.00
        height_cm: 8.3
        top_padding_cm: 0.4
        caption: "Figure 3. Overview of the proposed synthetic augmentation pipeline using per-class LoRA diffusion adapters and filtered synthetic data for classifier training."

  - id: "synthetic-image-filtering"
    title: "Synthetic Image Filtering"
    body: |
      To reduce low-quality or unsafe synthetic samples, we apply several filtering steps before using generated images for downstream classifier training.
    table:
      caption: "Table 1. Synthetic image filtering steps used to remove low-quality, inconsistent, memorized, or duplicate generated samples."
      columns:
        - "Filtering Step"
        - "Purpose"
      rows:
        - ["1. Artifact detection", "Remove blurry or broken-color images"]
        - ["2. Class-consistency check", "Remove images predicted as the wrong class"]
        - ["3. DINOv2 memorization check", "Detect synthetic images that are too similar to real images"]
        - ["4. Diversity deduplication", "Remove highly similar synthetic samples"]
        - ["5. Final filtered set", "Used for downstream classifier training"]
    technical_details:
      display: "small"
      items:
        - "Laplacian variance < 50"
        - "Channel std < 0.02"
        - "ConvNeXt-Tiny confidence < 0.70"
        - "Pairwise cosine similarity >= 0.95"

  - id: "experiment-design"
    title: "Experiment Design"
    body: |
      We compare real-only training against standard augmentation, oversampling, and multiple synthetic augmentation settings.
    table:
      caption: "Table 2. Training conditions used to evaluate whether synthetic diffusion augmentation improves CrohnIPI classification under severe class imbalance."
      columns:
        - "Condition"
        - "Description"
      rows:
        - ["Real only", "Baseline using only real images"]
        - ["Real + Augmented", "Standard clinical image augmentation"]
        - ["Oversampling", "Repeated rare-class real images"]
        - ["Synthetic uncapped", "Full per-class LoRA synthetic dataset"]
        - ["Synthetic balanced/capped", "Equal synthetic cap per class"]
        - ["Focal loss [4]", "Synthetic data with focal loss [4]"]
        - ["Inverse-frequency CE", "Synthetic data with class-weighted loss"]

  - id: "synthetic-dataset-design"
    title: "Synthetic Dataset Design"
    body: |
      Synthetic images were generated for each class using per-class LoRA adapters. We evaluate both uncapped synthetic datasets and balanced/capped synthetic datasets to study whether synthetic class balancing improves classification performance.
    figures:
      - id: "synthetic-images-per-class"
        path: "content/assets/crohn-ipi-diffusion/fig4-synthetic_data_grouped.pdf"
        width: 1.12
        height_cm: 12.5
        caption: "Figure 4. Number of generated synthetic images per class across different synthetic dataset variants."

  - id: "main-results"
    title: "Main Results"
    table:
      caption: "Table 3. Classification performance across real-only, augmentation, oversampling, and synthetic augmentation conditions. Focal Uncapped achieves the best Macro F1."
      columns:
        - "Method"
        - "Macro F1"
        - "Balanced Accuracy"
        - "Macro AUROC"
      rows:
        - ["Real only", 0.7888, 0.7781, 0.9709]
        - ["Real + Augmented", 0.7973, 0.7902, 0.9727]
        - ["Oversampling", 0.7786, 0.7596, 0.9628]
        - ["Synthetic", 0.8085, 0.7949, 0.9708]
        - ["Synthetic + Balanced", 0.8076, 0.8090, 0.9591]
        - ["Focal Uncapped", 0.8139, 0.8078, 0.9708]
        - ["Focal Balanced", 0.8077, 0.7969, 0.9721]
      bold_cells:
        - row: "Synthetic + Balanced"
          column: "Balanced Accuracy"
        - row: "Focal Uncapped"
          column: "Macro F1"
        - row: "Focal Balanced"
          column: "Macro AUROC"
    key_result: "Synthetic augmentation improves Macro F1 over the real-only baseline. The best Macro F1 is achieved using the Focal Uncapped synthetic condition."

  - id: "per-class-recall-analysis"
    title: "Per-Class Recall Analysis"
    body: |
      Synthetic augmentation improves recall for several rare classes, but the gains are not uniform across all labels. This suggests that diffusion-based augmentation can help with class imbalance, but class-specific generation quality remains important.
    figures:
      layout: "side_by_side"
      height_cm: 8.2
      item_width: 0.49
      gap_width: 0.02
      items:
        - id: "rare-class-recall"
          path: "content/assets/crohn-ipi-diffusion/fig5a-rare_class_recall_progression.png"
          caption: "Figure 5a. Rare-class recall across conditions; synthetic augmentation improves several rare classes."
        - id: "recall-advantage"
          path: "content/assets/crohn-ipi-diffusion/fig5b-recall_advantage_vs_real_only.png"
          caption: "Figure 5b. Recall advantage relative to the real-only baseline."

  - id: "failure-analysis"
    title: "Failure Analysis"
    body: |
      The current method still struggles with the E class. Failure analysis shows that some E samples are confused with other classes, including the majority class. This indicates that synthetic data alone is not enough; better class-specific generation and expert-guided filtering may be needed.
    figures:
      - id: "e-class-failure-analysis"
        path: "content/assets/crohn-ipi-diffusion/fig6-_current_method_e_failure_profile.png"
        width: 1.14
        height_cm: 15.3
        caption: "Figure 6. Failure analysis showing that the E class remains difficult under the current synthetic augmentation method."

  - id: "main-takeaways"
    title: "Main Takeaways"
    bullets:
      - "Per-class LoRA synthetic data improves class-imbalanced CrohnIPI classification."
      - "Synthetic augmentation outperforms oversampling; Focal Uncapped gives the best Macro F1."
      - "Balanced and focal settings improve complementary metrics."
      - "The E class remains challenging, motivating stronger filtering and expert validation."
    references:
      - "Vallée et al., CrohnIPI, SPIE Medical Imaging, 2020."
      - "Woo et al., ConvNeXt V2, CVPR, 2023."
      - "Podell et al., SDXL, ICLR, 2024."
      - "Mukhoti et al., Calibrating deep neural networks using focal loss, NeurIPS, 2020."

